
<?xml version="1.0" encoding="utf-8"?>
<!-- Premium vector engineering universe — richer layers, orbits, nodes, and subtle HUD accents -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Engineering universe illustration">
  <defs>
    <radialGradient id="coreGrad" cx="30%" cy="28%">
      <stop offset="0%" stop-color="#dffeff" stop-opacity="1" />
      <stop offset="28%" stop-color="#88d8f5" />
      <stop offset="56%" stop-color="#2a738f" />
      <stop offset="100%" stop-color="#07121a" />
    </radialGradient>
    <linearGradient id="atmo" x1="0" x2="1">
      <stop offset="0%" stop-color="#06111f" stop-opacity="0.86" />
      <stop offset="100%" stop-color="#02121a" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="ice" cx="70%" cy="36%">
      <stop offset="0%" stop-color="#f7feff" stop-opacity="1" />
      <stop offset="60%" stop-color="#d9f0f8" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#d9f0f8" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- deep atmosphere base -->
  <rect width="100%" height="100%" fill="url(#atmo)" />

  <!-- large soft ice overlay for light theme readability -->
  <rect width="100%" height="100%" fill="url(#ice)" opacity="0.12" />

  <!-- distant volumetric haze -->
  <g opacity="0.6">
    <ellipse cx="1250" cy="180" rx="420" ry="180" fill="#053341" opacity="0.12" />
    <ellipse cx="1400" cy="520" rx="260" ry="120" fill="#032a34" opacity="0.06" />
  </g>

  <!-- galaxy core with layered glows and spark points -->
  <g transform="translate(420,220)">
    <circle cx="0" cy="0" r="280" fill="url(#coreGrad)" filter="url(#glow)" opacity="0.98" />
    <g opacity="0.95">
      <circle cx="-34" cy="-14" r="10" fill="#dffaff" opacity="0.95" />
      <circle cx="36" cy="8" r="6" fill="#9feeff" opacity="0.95" />
      <circle cx="86" cy="36" r="3" fill="#b9f4ff" opacity="0.9" />
    </g>
  </g>

  <!-- multiple orbits with subtle gradients and slight rotation -->
  <g transform="translate(420,220)" fill="none" stroke="#79d9ff" stroke-opacity="0.12" stroke-width="2">
    <ellipse rx="360" ry="160" transform="rotate(-8)" />
    <ellipse rx="260" ry="110" transform="rotate(14)" />
    <ellipse rx="180" ry="72" transform="rotate(-28)" />
  </g>

  <!-- engineered nodes and beams (stylized) -->
  <g transform="translate(420,220)" opacity="0.96">
    <rect x="220" y="-20" width="46" height="10" rx="3" fill="#0e516f" filter="url(#tiny)" />
    <rect x="264" y="-8" width="22" height="6" rx="2" fill="#33b2d9" />
    <g transform="translate(-40,80) rotate(-8)">
      <rect x="10" y="-6" width="68" height="6" rx="3" fill="#0a3b4e" opacity="0.9" />
    </g>
  </g>

  <!-- small satellites / data packets with motion trails -->
  <g fill="#9feaff" opacity="0.96">
    <circle cx="820" cy="130" r="4" />
    <circle cx="980" cy="210" r="3" />
    <rect x="760" y="300" width="8" height="4" rx="1" />
    <path d="M810 126 C830 120 860 118 890 122" stroke="#7bd7ff" stroke-width="2" fill="none" stroke-opacity="0.25" />
  </g>

  <!-- subtle HUD accent lines (low-opacity, disappear in hero-fix overrides) -->
  <g opacity="0.08" fill="none" stroke="#79d9ff" stroke-width="1">
    <line x1="120" y1="60" x2="320" y2="40" />
    <line x1="180" y1="300" x2="340" y2="260" />
  </g>

  <!-- foreground vignette to focus left area -->
  <radialGradient id="fg" cx="30%" cy="30%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
  </radialGradient>
  <rect width="100%" height="100%" fill="url(#fg)" opacity="0.09" />

  <!-- fine noise speckles for texture -->
  <g opacity="0.05">
    <circle cx="300" cy="600" r="2" fill="#fff" />
    <circle cx="500" cy="420" r="1.5" fill="#fff" />
    <circle cx="1400" cy="120" r="1.2" fill="#fff" />
  </g>
</svg>
